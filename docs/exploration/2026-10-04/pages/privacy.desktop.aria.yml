- heading "Privacy Policy Notice" [level=1]
- paragraph: "The policy: This privacy policy notice is for this website; https://automationintesting.online and served by MW Test Consultancy, 7 Sheridan Close, Norwich, Norfolk, NR8 6RW and governs the privacy of those who use it. The purpose of this policy is to explain to you how we control, process, handle and protect your personal information while browsing or using this website, including your rights under current laws and regulations. If you do not agree to the following policy you may wish to cease viewing / using this website."
- paragraph: "Policy key definitions:"
- list:
  - listitem: "\"I\", \"our\", \"us\", or \"we\" refer to the business, MW Test Consultancy."
  - listitem: "\"you\", \"the user\" refer to the person(s) using this website."
  - listitem: GDPR means General Data Protection Act.
  - listitem: PECR means Privacy and Electronic Communications Regulation.
  - listitem: ICO means Information Commissioner's Office.
  - listitem: Cookies mean small files stored on a users computer or device.
- heading "Processing of your personal data" [level=2]
- paragraph: Under the GDPR (General Data Protection Regulation) we control and / or process any personal information about you electronically using the following lawful bases.
- paragraph: We are exempt from registration in the ICO Data Protection Register because Organisations that do not decide how personal data is processed are exempt. You therefore do not have to pay a fee to the ICO .
- heading "Information we collect automatically" [level=2]
- paragraph: We collect information about you when you use our Services, including browsing our websites and when you use specific features.
- heading "Your Use Of Our Services:" [level=3]
- paragraph: We track certain information about you when you visit and interact with our Services. This information includes, but is not limited to, the features you use, for example, the content you view and how long you use our Services. We also track frequently used search terms and selected keywords to help us prioritise and source content on those topics.
- heading "Device And Connection Information:" [level=3]
- paragraph: We collect information about the device you use to access our Services. This device information includes device type, screen height and screen width. We also collect information about the operating system on the device and the browser you're using to access our Services. This information is used to optimize our Services for the most popular devices and browsers, and to assist us with prioritising our testing.
- paragraph: We collect information about your referer to our services and which page you initially land on. We use your IP address in order to help us tailor our Services to your location. How much of this information we collect depends on the type and settings of the device you use to access our Services.
- heading "Cookies And Other Tracking Technologies:" [level=3]
- paragraph:
  - text: We use cookies and similar tracking technologies to collect information about your interactions with our Services in order to help us improve user experience. We also use Google Analytics cookies to help us understand how you arrived to our site and what you spent your time looking at. For more information about cookies, please see our
  - link "Cookie-Policy":
    - /url: /cookie
- heading "Your individual rights" [level=2]
- paragraph: Under the GDPR your rights are as follows. You can read more about your rights in details here;
- list:
  - listitem: the right to be informed;
  - listitem: the right of access;
  - listitem: the right to rectification;
  - listitem: the right to erasure;
  - listitem: the right to restrict processing;
  - listitem: the right to data portability;
  - listitem: the right to object; and
  - listitem: the right not to be subject to automated decision-making including profiling.
  - listitem: You also have the right to complain to the ICO [www.ico.org.uk] if you feel there is a problem with the way we are handling your data.
- paragraph: We handle subject access requests in accordance with the GDPR.
- heading "Internet cookies" [level=2]
- paragraph: We use cookies on this website to provide you with a better user experience. We do this by placing a small text file on your device / computer hard drive to track how you use the website, to record or log whether you have seen particular messages that we display, to keep you logged into the website where applicable, to display relevant adverts or content, referred you to a third party website.
- paragraph: Some cookies are required to enjoy and use the full functionality of this website.
- paragraph: Some cookies will be saved for specific time periods, where others may last indefinitely. Your web browser should provide you with the controls to manage and delete cookies from your device, please see your web browser options.
- paragraph: Cookies that we use are;
- list:
  - listitem: CloudFlare - Responsible for security and caching of the website
  - listitem: Google Analytics - Responsible tracking user interaction with automationintesting.online to help improve the experience of the application
  - listitem: Custom cookies - Responsible for enabling and disabling specific features within the application. These are not used for tracking user behaviour
- heading "Data security and protection" [level=2]
- paragraph: We ensure the security of any personal information we hold by using secure data storage technologies and precise procedures in how we store, access and manage that information. Our methods meet the GDPR compliance requirement.
- heading "Transparent Privacy Explanations" [level=2]
- paragraph: We have provided some further explanations about user privacy and the way we use this website to help promote a transparent and honest user privacy methodology.
- heading "Sponsored links, affiliate tracking and commissions" [level=2]
- paragraph: Our website may contain adverts, sponsored and affiliate links on some pages. These are typically served through our advertising partners; Google Adsense, eBay Partner Network, Amazon Affiliates, or are self served through our own means. We only use trusted advertising partners who each have high standards of user privacy and security. However we do not control the actual adverts seen / displayed by our advertising partners. Our ad partners may collect data and use cookies for ad personalisation and measurement. Where ad preferences are requested as 'non-personalised' cookies may still be used for frequency capping, aggregated ad reporting and to combat fraud and abuse.
- paragraph: "Clickable sponsored or affiliate links may be displayed as a website URL like this; www.automationintesting.online or as a titled text link like this: Sponsored by Test tool provider."
- paragraph: Clicking on any adverts, sponsored or affiliate links may track your actions by using a cookie saved to your device. You can read more about cookies on this website above. Your actions are usually recorded as a referral from our website by this cookie. In most cases we earn a very small commission from the advertiser or advertising partner, at no cost to you, whether you make a purchase on their website or not.
- paragraph: We use advertising partners in these ways to help generate an income from the website, which allows us to continue our work and provide you with the best overall experience and valued information.
- paragraph: If you have any concerns about this we suggest you do not click on any adverts, sponsored or affiliate links found throughout the website.
