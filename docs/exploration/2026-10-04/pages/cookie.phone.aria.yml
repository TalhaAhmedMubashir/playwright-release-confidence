- heading "What should you do if you don't want cookies to be set?" [level=2]
- paragraph: Some people find the idea of a website storing information on their computer or mobile device to be intrusive, particularly when this information is stored and used by a third party without them knowing. Although cookies are generally quite harmless, you may not, for example, want to see advertising that has been targeted to your interests using your browser history. If you prefer, you may choose to block some or all cookies, or even to delete cookies that have already been set; but you should be aware that you might lose some functions of the website.
- paragraph: If you want to restrict or block the cookies that are set by our Site, or any other site, you can do so through your browser setting. The 'Help' function in your browser should explain how. Alternatively, you can visit www.aboutcookies.org, which contains comprehensive information on how to do this on a wide variety of browsers. You will find general information about cookies and details on how to delete cookies from your machine.
- paragraph: To opt-out of third-parties collecting any data regarding your interaction on our Site, please refer to their websites for further information.
