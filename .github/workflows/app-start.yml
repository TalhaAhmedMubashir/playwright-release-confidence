name: App start-up trial

# Times how long the app takes to start on a fresh CI machine, 3 times in parallel, then applies
# the rule in DECISIONS.md (decision 1). A new app version or start script is a new decision.

on:
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - scripts/start-app.mjs
      - scripts/trial-verdict.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start:
    name: Start the app (run ${{ matrix.run }} of 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Start the app and time it
        run: node scripts/start-app.mjs
        env:
          TRIAL_RUN: ${{ matrix.run }}

      - name: Show the app's logs
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Keep the timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timings-${{ matrix.run }}
          path: timings.json
          if-no-files-found: ignore

  verdict:
    name: Apply the rule
    needs: start
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: timings-*
          path: timings

      - name: Keep the app or fall back
        run: node scripts/trial-verdict.mjs timings
