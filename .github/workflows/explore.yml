name: Explore the app

# Starts the app and records what a visitor sees (explore/visitor.mjs, explore/flows.mjs) and, signed
# in on our own copy, the admin area (explore/admin.mjs). The records are the source
# of every selector the tests use. Download them from the run's artifacts.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    name: Explore the app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Start the app
        run: node scripts/start-app.mjs

      - name: Record every page a visitor can reach
        run: node explore/visitor.mjs

      - name: Try what a visitor can do
        run: node explore/flows.mjs

      - name: Record the admin area, signed in on our own copy
        run: node explore/admin.mjs

      - name: Try what the admin area lets you do, on our own copy
        run: node explore/admin-flows.mjs

      - name: Show the app's logs
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Keep the records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exploration
          path: exploration/
          retention-days: 30
